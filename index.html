                }
            }
        }

        ctx.restore();

    //defines a rectangular area with functions to calculate boundaries from two points
    class Bounds {
        //creates a Bounds instance by determining top-left origin and dimensions from any two corners
        static fromCorners(x1, y1, x2, y2) {
            const x = Math.min(x1, x2);
            const y = Math.min(y1, y2);
            const width = Math.abs(x1 - x2);
            const height = Math.abs(y1 - y2);
            return new Bounds(x, y, width, height);
        }

        //horizontal and vertical origin
        x = 0;
        y = 0;

        width = 0;
        height = 0;


        constructor(x, y, width, height) {
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
        }

        //right edge coordinate
        get maxX() {
            return this.x + this.width;
        }

        //bottom edge coordinate
        get maxY() {
            return this.y + this.height;
        }
    }

    //coordinate conversions between world space and a fixed-size grid system
    class Grid {
        //default pixel size of a single grid cell
        size = 40;


        setSize(value) {
            this.size = value;
        }

        //converts cell index to pixel coordinate and vice-versa
        cellToWorld(x) {
            return x * this.size;
        }
        worldToCell(x) {
            return Math.floor(x / this.size);
        }

        //calculates which grid cell indices are covered by a specific world-space bounds object
        getIndicesFromBounds(bounds) {
            return Bounds.fromCorners(
                Math.floor(bounds.x / this.size),
                Math.floor(bounds.y / this.size),
                Math.ceil(bounds.maxX / this.size),
                Math.ceil(bounds.maxY / this.size)
            );
        }

        //generator that iterates through every cell coordinate within the provided bounds
        * visitCells(bounds) {
            const indexBounds = this.getIndicesFromBounds(bounds);
            for (let x = indexBounds.x; x < indexBounds.maxX; x++) {
                for (let y = indexBounds.y; y < indexBounds.maxY; y++) {
                    yield {
                        x,
                        y
                    };
                }
            }
        }

    }



    //A 2D data structure for storing and retrieving values (like characters or light levels) at coordinates
    class Raster {
        //nested array representing rows and columns
        data = [];

        set(x, y, value) {
            if (!this.data[y]) {
                this.data[y] = [];
            }
            this.data[y][x] = value;
        }

        //retrieves value or returns null if undefined
        get(x, y) {
            return this.data[y]?.[x] ?? null;
        }

        //resets entire data set
        clear() {
            this.data.length = 0;
        }


        //static factory that converts strings or 2D arrays into a populated Raster instance
        static fromBitmap(bitmap, converter = null) {
            const raster = new Raster();
            if (typeof bitmap === "string") {
                bitmap = bitmap.split("\n");
            }
            bitmap.forEach((row, y) => {
                if (typeof row === "string") {
                    row = row.split("");
                }
                row.forEach((symbol, x) => {
                    if (converter) {
                        raster.set(x, y, converter(x, y, symbol));
                    } else {
                        raster.set(x, y, symbol);
                    }
                });
            });
            return raster;
        }
    }


    //calculates light propagation across a grid based on cell types and decay settings
    class Lighting {
        //stores calculated light intensity per cell
        data = new Raster();

        constructor(grid, palette, settings) {
            //reference to the grid scale
            this.grid = grid;
            //mapping of symbols to properties like solidity and emission
            this.palette = palette;
            //configuration for light decay and minimum levels
            this.settings = settings;
        }

        // Checks if a cell blocks light
        isSolid(symbol) {
            return !!(this.palette[symbol]?.isSolid);
        }

        // Gets base brightness of a cell
        getEmission(symbol) {
            return this.palette[symbol]?.emission ?? 0;
        }

        // Calculates a cell's light level by diffusing light from neighbors and applying decay
        getLightLevel(x, y, symbol) {
            const left = this.data.get(x - 1, y);
            const right = this.data.get(x + 1, y);
            const top = this.data.get(x, y - 1);
            const bottom = this.data.get(x, y + 1);

            const highestNeighbor = Math.max(left, right, top, bottom);
            // Apply different decay rates depending on whether the light is passing through a solid or air
            const lightLevel = Math.max(highestNeighbor * (this.isSolid(symbol) ? this.settings.groundDecay : this.settings.airDecay), this.settings.minLevel);
            const emission = this.getEmission(symbol);
            // If cell emits its own light, use that; otherwise, use calculated diffused light
            if (emission > lightLevel) {
                //
                this.data.set(x, y, emission);
                return emission;
            } else {
                this.data.set(x, y, lightLevel);
                return highestNeighbor; // Do not return the actual calculated light level for the cell. Instead return the highest neighbor, which allows solid blocks adjacent to air to be lit
            }
        }

    }

    function updateAndRenderLighting(lighting) {
        for (let {
                x,
                y
            }
            of lighting.grid.visitCells(camera)) {
            const symbol = levelArray.get(x, y);
            ctx.fillStyle = `rgba(0, 0, 0, ${ 1- lighting.getLightLevel(x, y, symbol)})`;

            ctx.fillRect(lighting.grid.cellToWorld(x), lighting.grid.cellToWorld(y), lighting.grid.size, lighting.grid.size);
        }
    }

    function mapSetup(LEVEL) {
        blocks = [];
        
        //let MAP = LEVEL;
        let longestX = 0;
        
        //create blocks and player
        for (let i = 0; i < MAP[LEVEL].length; i++) {
            for (let j = 0; j < MAP[LEVEL][i].length; j++) {
                const sym = MAP[LEVEL][i][j];
                switch (sym) {
                    case "#":
                        blocks.push(new Block(j * blockSize, i * blockSize, blockSize, blockSize, "block"));
                        break;
                    case "!":
                        blocks.push(new Block(j * blockSize, i * blockSize, blockSize, blockSize, "hazard"));
                        break;
                    case "%":
                        blocks.push(new Block(j * blockSize, i * blockSize, blockSize, blockSize, "portal"));
                        break;
                    case "$":
                        blocks.push(new Block(j * blockSize, i * blockSize, blockSize, blockSize, "tramp"));
                        break;
                    case "_":
                        blocks.push(new Block(j * blockSize, i * blockSize, blockSize, blockSize, "mud"));
                        break;
                    case "&":
                        blocks.push(new Block(j * blockSize, i * blockSize, blockSize, blockSize, "ice"));
                        break;
                    case "@":
                        player.x = j * blockSize;
                        player.y = i * blockSize;
                        break;
                }
                if (player.health <= 0 && MAP[LEVEL] && MAP[LEVEL][i] && MAP[LEVEL][i][j] === "@") {
                    player.x = j * blockSize;
                    player.y = i * blockSize;
                    player.health = 10;
                }
            }
            
            if(MAP[LEVEL][i].length > longestX){
                longestX = MAP[LEVEL][i].length;
            }
        }
        
        
        //fetch the width and height of each level in pixels
        lvlSizeX = longestX * blockSize;
        lvlSizeY = MAP[LEVEL].length * blockSize;
        
        //alert(lvlSizeX)
        //lighting setup
        grid = new Grid();
        grid.setSize(blockSize);
        levelArray = Raster.fromBitmap(MAP[LEVEL]);
        camera = new Bounds(-width, -height, lvlSizeX + width + width/2, lvlSizeY + height + height/2);
        lighting = new Lighting(grid, {
            "!": {
                emission: 1,
            },
            "%": {
                emission: 1,
            },
            "#": {
                isSolid: true,
            },
        }, {
            airDecay: 0.9,
            groundDecay: 0,
            minLevel: 0,
        });
        
    }

    //camera shake
    const shakes = []; 
    let shake = {
        x: 0,
        y: 0,
    };
    const Shake = (function () {
        let Shake = function (n) {
            //shake power
            this.n = n;
        };
        Shake.prototype = {
            active: function(increment){
                //apply shake
                shake.x = (Math.random()*2-1)*this.n;
                shake.y = (Math.random()*2-1)*this.n;
                
                //fade the shake
                this.n -= 0.5;
                
                if (this.n < 0) {
                    shake.x = 0;
                    shake.y = 0;
                    shakes.splice(increment, 1);
                }
            }
        };
        return Shake;
    })();

        y: player.y,
        z: 1,
        update() {
            this.x = lerp(this.x, player.x * this.z, 0.1);
            this.y = lerp(this.y, player.y * this.z, 0.1);
            ctx.translate(~~(-this.x + shake.x + width / 2 ), ~~(-this.y + shake.y + height / 2));
            ctx.scale(this.z, this.z);
        },
    };

    function app() {
        if (player.y > (lvlSizeY + 40)) {
            player.health--;
        }
        if(player.x > lvlSizeX + 40){
           player.health--; 
        }
        if(player.y < (0 - 200)){
            player.health--;
        }
        if(player.x < (0 - 40)){
            player.health--;
        }
        
        if (player.health <= 0) {
            timer++;
            
            if(timer > 25){
                
                player.acceleration = 600;
                player.gravity = 600;
                
                mapSetup(currentLevel - 1);
                timer = 0;
            }
            else {
                
                player.v.x = 0;
                player.v.y = 0;
                player.acceleration = 0;
                player.gravity = 0;
            }
        }
        if (nxt) {
            mapSetup(currentLevel);
            currentLevel++;
            player.health = 10;
            nxt = false;
            localStorage.setItem("storedLevel", currentLevel);
        }
    }

            blocks[i].draw();
        }

            sax.width = "40%";
            
        }
        
        // ctx.strokeStyle = "red";
        // ctx.strokeRect(0, 0, lvlSizeX, lvlSizeY);
        
        
        
        ctx.restore();
        
        if(player.health < 0 && timer < 25){
            ctx.fillStyle = "rgba(55, 56, 55, 0.1)";
            let t = 0;
            t = lerp(t, timer * 3, 0.8);
            ctx.strokeStyle = "white";
            ctx.save();
                let x = 0 + t;
                let y = 0 + t;
                //ctx.translate(x / 2, y / 2);
                ctx.strokeRect(x,y, 600 - t - t, 600 - t - t);
                ctx.fillRect(x, y, 600 - t - t, 600 - t - t)
            ctx.restore();
            
        }
        
        if(!freeze){
            //window.requestAnimationFrame(loop);
        }
    };

    /* Initialize first map and start loop */
    mapSetup(currentLevel);
    
    let rafId = null;
    let running = true;
    
    //pause when tab hidden to avoid wasted frames
    document.addEventListener('visibilitychange', () => {
        running = !document.hidden;
        if (running && rafId === null) {
            rafId = requestAnimationFrame(loop);
        }
        if (!running && rafId !== null) { 
            cancelAnimationFrame(rafId); 
            rafId = null; 
        }
    });
    
    function loop(now) {
        //if(!debug.freeze){
            if (!running) { 
                rafId = null; return; 
            }
            render(now);
            rafId = requestAnimationFrame(loop);
        //}
        //console.info(debug.freeze);
    }
    
    // start
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);



} catch (e) {

}
